name: Daejeon Dolby Alert

on:
  schedule:
    - cron: "2-59/5 * * * *"

  workflow_dispatch:
    inputs:
      send_test:
        description: "Send Discord test message"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daejeon-dolby-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Daejeon Dolby
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
          TEST_MODE: ${{ github.event.inputs.send_test || 'false' }}
        run: python main.py

      - name: Save alert state
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "Update Dolby alert state"
          git pull --rebase
          git push
